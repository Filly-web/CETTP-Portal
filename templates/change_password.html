{% extends "base.html" %}{% block title %}Change Password | CETTP{% endblock %}
{% block content %}<div class="container py-5" style="max-width:640px"><div class="card shadow-sm"><div class="card-body p-4"><h2 class="h4 mb-2">Set a new password</h2><p class="text-muted">For your security, choose a new password before continuing.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="new_password">New password</label><input class="form-control mb-3" type="password" id="new_password" name="new_password" minlength="12" required autocomplete="new-password"><label class="form-label" for="confirm_password">Confirm password</label><input class="form-control mb-3" type="password" id="confirm_password" name="confirm_password" minlength="12" required autocomplete="new-password"><div class="form-text mb-3">Minimum 12 characters.</div><button class="btn btn-primary w-100">Update password</button></form></div></div></div>{% endblock %}
