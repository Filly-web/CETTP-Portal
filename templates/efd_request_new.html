{% extends 'base.html' %}{% block title %}Request EFD Invoice{% endblock %}{% block content %}
<div class="container-fluid py-3"><h2>Request EFD Invoice</h2><p class="text-muted">Submit the customer's invoice for EFD processing.</p>
<div class="card shadow-sm"><div class="card-body"><form method="post" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Customer Name *</label><input class="form-control" name="customer_name" maxlength="180" required></div>
<div class="mb-3"><label class="form-label">Customer Invoice (Word document) *</label><input class="form-control" type="file" name="invoice_file" accept=".doc,.docx" required><div class="form-text">Only Word documents (.doc or .docx), maximum 15 MB.</div></div>
<button class="btn btn-primary" type="submit">Submit EFD Invoice Request</button></form></div></div></div>{% endblock %}
